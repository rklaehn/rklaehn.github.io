<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600">
  <!-- Background -->
  <rect width="200" height="600" fill="#1a1a2e"/>

  <!-- Stars (subtle) -->
  <g fill="#fff" opacity="0.5">
    <circle cx="30" cy="100" r="0.8"/>
    <circle cx="170" cy="200" r="0.6"/>
    <circle cx="40" cy="350" r="0.7"/>
    <circle cx="160" cy="450" r="0.5"/>
    <circle cx="25" cy="490" r="0.6"/>
    <circle cx="180" cy="80" r="0.5"/>
    <circle cx="20" cy="220" r="0.4"/>
    <circle cx="175" cy="540" r="0.7"/>
  </g>

  <!-- Top LOX tank: rounded nose IS the tank -->
  <path d="M 65 90
           C 65 50 80 30 100 30
           C 120 30 135 50 135 90
           L 135 235
           Q 100 252 65 235
           Z"
        fill="#8cf" stroke="#888" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#003366">LOX</text>

  <!-- CH4 tank with rounded common bulkheads top and bottom -->
  <path d="M 65 235
           Q 100 252 135 235
           L 135 340
           Q 100 357 65 340
           Z"
        fill="#fc8" stroke="#888" stroke-width="1.5"/>
  <text x="100" y="305" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#552200">CH4</text>

  <!-- Bottom LOX tank with rounded top AND rounded bottom -->
  <path d="M 65 340
           Q 100 357 135 340
           L 135 510
           Q 100 527 65 510
           Z"
        fill="#8cf" stroke="#888" stroke-width="1.5"/>
  <text x="100" y="440" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#003366">LOX</text>

  <!-- Aft skirt: top matches rounded bottom of LOX tank, same diameter as tanks -->
  <path d="M 65 510
           Q 100 527 135 510
           L 135 580
           L 65 580
           Z"
        fill="#666" stroke="#888" stroke-width="1.5"/>

  <!-- Three Raptor engines inside skirt, nozzle exits flush with skirt bottom -->
  <polygon points="74,538 68,580 88,580 82,538" fill="#222" stroke="#444" stroke-width="0.5"/>
  <polygon points="96,538 90,580 110,580 104,538" fill="#222" stroke="#444" stroke-width="0.5"/>
  <polygon points="118,538 112,580 132,580 126,538" fill="#222" stroke="#444" stroke-width="0.5"/>
</svg>
