<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <style>
    .tether { stroke: #667; stroke-width: 2; stroke-linecap: round; }
    .wheel { fill: #555; stroke: #99a; stroke-width: 1.5; }
    .axle { fill: #aaa; }
    .weight { fill: #777; stroke: #999; stroke-width: 2; }
  </style>

  <!-- Background -->
  <rect width="300" height="400" fill="#1a1a2e"/>

  <!-- Swing arm + bearing: pivots from (150, 120) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      dur="4s" repeatCount="indefinite"
      values="0 150 120;0 150 120;25 150 120;25 150 120;0 150 120"
      keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline"
      keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <!-- Arm down to bearing -->
    <line x1="150" y1="123" x2="150" y2="183" stroke="#667" stroke-width="2" stroke-linecap="round"/>
    <!-- Extension arm left -->
    <line x1="150" y1="120" x2="90" y2="120" stroke="#667" stroke-width="2" stroke-linecap="round"/>
    <circle cx="90" cy="120" r="3" fill="#99a"/>
    <!-- Extension arm right -->
    <line x1="150" y1="120" x2="210" y2="120" stroke="#667" stroke-width="2" stroke-linecap="round"/>
    <circle cx="210" cy="120" r="3" fill="#99a"/>
    <!-- Ball bearing -->
    <circle cx="150" cy="195" r="12" class="wheel"/>
    <circle cx="150" cy="195" r="3" class="axle"/>
    <circle cx="150" cy="195" r="7" fill="none" stroke="#777" stroke-width="1"/>
  </g>

  <!-- LEFT rubber band: fixed (90,30) to left extension tip -->
  <!-- Top half-circle (outward = up, sweep CW) -->
  <path fill="none" stroke="#c44" stroke-width="1.5" d="M 87 30 A 3 3 0 0 1 93 30"/>
  <!-- Bottom half-circle (outward = down, sweep CW) -->
  <path fill="none" stroke="#c44" stroke-width="1.5">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M 93 120 A 3 3 0 0 1 87 120;M 93 120 A 3 3 0 0 1 87 120;M 99 95 A 3 3 0 0 1 93 95;M 99 95 A 3 3 0 0 1 93 95;M 93 120 A 3 3 0 0 1 87 120"
      keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </path>
  <!-- Left line -->
  <line stroke="#c44" stroke-width="1.5" x1="87" y1="30" x2="87" y2="120">
    <animate attributeName="x2" dur="4s" repeatCount="indefinite"
      values="87;87;93;93;87" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y2" dur="4s" repeatCount="indefinite"
      values="120;120;95;95;120" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </line>
  <!-- Right line -->
  <line stroke="#c44" stroke-width="1.5" x1="93" y1="30" x2="93" y2="120">
    <animate attributeName="x2" dur="4s" repeatCount="indefinite"
      values="93;93;99;99;93" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y2" dur="4s" repeatCount="indefinite"
      values="120;120;95;95;120" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </line>
  <!-- Fixed point -->
  <circle cx="90" cy="30" r="3" fill="#99a"/>

  <!-- Hook line + hook: rotates slightly to release arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      dur="4s" repeatCount="indefinite"
      values="0 210 30;0 210 30;-10 210 30;-10 210 30;0 210 30"
      keyTimes="0;0.25;0.32;0.85;1"
      calcMode="spline"
      keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <line x1="210" y1="30" x2="213" y2="124" stroke="#667" stroke-width="2" stroke-linecap="round"/>
    <line x1="213" y1="124" x2="207" y2="124" stroke="#667" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brief blue force arrow pushing hook -->
  <g opacity="0">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;0;1;0;0" keyTimes="0;0.23;0.27;0.35;1"/>
    <line x1="188" y1="80" x2="200" y2="80" stroke="#4ae" stroke-width="2" stroke-linecap="round"/>
    <polygon points="200,76 208,80 200,84" fill="#4ae"/>
  </g>

  <!-- Fixed point above right extension arm -->
  <circle cx="210" cy="30" r="3" fill="#99a"/>

  <!-- Pivot point (on top of arms) -->
  <circle cx="150" cy="120" r="3" fill="#99a"/>

  <!-- Latch + payload: drops out of frame, fades, snaps back -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      dur="4s" repeatCount="indefinite"
      values="0 0;0 0;0 250;0 250;0 0;0 0"
      keyTimes="0;0.3;0.6;0.84;0.85;1"
      calcMode="spline"
      keySplines="0.5 0 0.5 1;0.4 0 1 0.2;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="opacity"
      dur="4s" repeatCount="indefinite"
      values="1;1;0;0;1;1"
      keyTimes="0;0.55;0.6;0.84;0.85;1"/>

    <!-- Latch point -->
    <circle cx="150" cy="179" r="3" fill="#bbc"/>

    <!-- Rope from latch to payload -->
    <line x1="150" y1="183" x2="150" y2="260" class="tether"/>

    <!-- Stylized weight -->
    <circle cx="150" cy="280" r="20" class="weight"/>
    <text x="150" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" fill="#bbb">m</text>
  </g>
</svg>
