<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <style>
    .tether { stroke: #667; stroke-width: 2; stroke-linecap: round; }
    .wheel { fill: #555; stroke: #99a; stroke-width: 1.5; }
    .axle { fill: #aaa; }
    .weight { fill: #777; stroke: #999; stroke-width: 2; }
  </style>

  <defs>
    <!-- One side of the symmetric mechanism (left) -->
    <g id="arm-side">
      <!-- Swing arm + bearing: pivots from (132, 210) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          dur="4s" repeatCount="indefinite"
          values="0 132 210;0 132 210;25 132 210;25 132 210;0 132 210"
          keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline"
          keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
        <!-- Arm down to bearing -->
        <line x1="132" y1="213" x2="132" y2="273" stroke="#667" stroke-width="2" stroke-linecap="round"/>
        <!-- Extension up-left at 30° from vertical, ~120px -->
        <line x1="132" y1="210" x2="72" y2="106" stroke="#667" stroke-width="2" stroke-linecap="round"/>
        <!-- Ball bearing -->
        <circle cx="132" cy="285" r="12" class="wheel"/>
        <circle cx="132" cy="285" r="3" class="axle"/>
        <circle cx="132" cy="285" r="7" fill="none" stroke="#777" stroke-width="1"/>
      </g>

      <!-- Connecting arm: from extension tip to center -->
      <line stroke="#667" stroke-width="2" stroke-linecap="round"
        x1="72" y1="106" x2="150" y2="109">
        <animate attributeName="x1" dur="4s" repeatCount="indefinite"
          values="72;72;122;122;72" keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
        <animate attributeName="y1" dur="4s" repeatCount="indefinite"
          values="106;106;90;90;106" keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
        <animate attributeName="y2" dur="4s" repeatCount="indefinite"
          values="109;109;17;17;109" keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
      </line>

      <!-- Extension tip circle (on top of connecting arm) -->
      <circle r="3" fill="#99a">
        <animate attributeName="cx" dur="4s" repeatCount="indefinite"
          values="72;72;122;122;72" keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
        <animate attributeName="cy" dur="4s" repeatCount="indefinite"
          values="106;106;90;90;106" keyTimes="0;0.3;0.5;0.85;1"
          calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
      </circle>

      <!-- Pivot point (on top of arm) -->
      <circle cx="132" cy="210" r="3" fill="#99a"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="#1a1a2e"/>

  <!-- Vertical line showing center circle travel range -->
  <line x1="150" y1="17" x2="150" y2="109" class="tether"/>

  <!-- Left side -->
  <use href="#arm-side"/>

  <!-- Right side (mirrored around x=150) -->
  <use href="#arm-side" transform="translate(300, 0) scale(-1, 1)"/>

  <!-- Rubber band wrapped around extension tip circles -->
  <!-- Left half-circle (outside of left tip) -->
  <path fill="none" stroke="#c44" stroke-width="1.5" d="M 72 103 A 3 3 0 0 0 72 109">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M 72 103 A 3 3 0 0 0 72 109;M 72 103 A 3 3 0 0 0 72 109;M 122 87 A 3 3 0 0 0 122 93;M 122 87 A 3 3 0 0 0 122 93;M 72 103 A 3 3 0 0 0 72 109"
      keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </path>
  <!-- Right half-circle (outside of right tip) -->
  <path fill="none" stroke="#c44" stroke-width="1.5" d="M 228 103 A 3 3 0 0 1 228 109">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M 228 103 A 3 3 0 0 1 228 109;M 228 103 A 3 3 0 0 1 228 109;M 178 87 A 3 3 0 0 1 178 93;M 178 87 A 3 3 0 0 1 178 93;M 228 103 A 3 3 0 0 1 228 109"
      keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </path>
  <!-- Top horizontal line -->
  <line stroke="#c44" stroke-width="1.5" x1="72" y1="103" x2="228" y2="103">
    <animate attributeName="x1" dur="4s" repeatCount="indefinite"
      values="72;72;122;122;72" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y1" dur="4s" repeatCount="indefinite"
      values="103;103;87;87;103" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="x2" dur="4s" repeatCount="indefinite"
      values="228;228;178;178;228" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y2" dur="4s" repeatCount="indefinite"
      values="103;103;87;87;103" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </line>
  <!-- Bottom horizontal line -->
  <line stroke="#c44" stroke-width="1.5" x1="72" y1="109" x2="228" y2="109">
    <animate attributeName="x1" dur="4s" repeatCount="indefinite"
      values="72;72;122;122;72" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y1" dur="4s" repeatCount="indefinite"
      values="109;109;93;93;109" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="x2" dur="4s" repeatCount="indefinite"
      values="228;228;178;178;228" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
    <animate attributeName="y2" dur="4s" repeatCount="indefinite"
      values="109;109;93;93;109" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </line>

  <!-- Brief red force arrow pushing center circle up -->
  <g opacity="0">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;0;1;0;0" keyTimes="0;0.28;0.32;0.42;1"/>
    <line x1="150" y1="140" x2="150" y2="118" stroke="#4ae" stroke-width="2" stroke-linecap="round"/>
    <polygon points="146,118 150,110 154,118" fill="#4ae"/>
  </g>

  <!-- Center point where connecting arms meet -->
  <circle cx="150" r="3" fill="#99a">
    <animate attributeName="cy" dur="4s" repeatCount="indefinite"
      values="109;109;17;17;109" keyTimes="0;0.3;0.5;0.85;1"
      calcMode="spline" keySplines="0.5 0 0.5 1;0.1 0 0.5 1;0.5 0 0.5 1;0.3 0 0.7 1"/>
  </circle>

  <!-- Latch + payload: drops out of frame, fades, snaps back -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      dur="4s" repeatCount="indefinite"
      values="0 0;0 0;0 250;0 250;0 0;0 0"
      keyTimes="0;0.3;0.6;0.84;0.85;1"
      calcMode="spline"
      keySplines="0.5 0 0.5 1;0.4 0 1 0.2;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
    <animate attributeName="opacity"
      dur="4s" repeatCount="indefinite"
      values="1;1;0;0;1;1"
      keyTimes="0;0.55;0.6;0.84;0.85;1"/>

    <!-- Two latch points resting on bearings -->
    <circle cx="132" cy="269" r="3" fill="#bbc"/>
    <circle cx="168" cy="269" r="3" fill="#bbc"/>

    <!-- Hook bar connecting the two latch points -->
    <line x1="132" y1="269" x2="168" y2="269" stroke="#bbc" stroke-width="2" stroke-linecap="round"/>

    <!-- Rope from hook center down to payload -->
    <line x1="150" y1="269" x2="150" y2="350" class="tether"/>

    <!-- Stylized weight -->
    <circle cx="150" cy="370" r="20" class="weight"/>
    <text x="150" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" fill="#bbb">m</text>
  </g>
</svg>
